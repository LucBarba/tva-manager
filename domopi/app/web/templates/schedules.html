{% extends "base.html" %}
{% block title %}Programmations – DomoPi{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h1 class="h3 mb-0"><i class="bi bi-clock-history"></i> Programmations horaires</h1>
  <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#schedule-modal">
    <i class="bi bi-plus-lg"></i> Programmation</button>
</div>

<div class="table-responsive">
  <table class="table align-middle">
    <thead>
      <tr><th>Nom</th><th>Cible</th><th>Action</th><th>Heure</th><th>Jours</th><th>Active</th><th></th></tr>
    </thead>
    <tbody id="schedule-rows"></tbody>
  </table>
</div>

<!-- Modale : creation d'une programmation -->
<div class="modal fade" id="schedule-modal" tabindex="-1">
  <div class="modal-dialog">
    <form class="modal-content" id="schedule-form">
      <div class="modal-header"><h5 class="modal-title">Nouvelle programmation</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div class="mb-3"><label class="form-label">Nom</label>
          <input class="form-control" name="name" required maxlength="64"></div>
        <div class="mb-3"><label class="form-label">Cible</label>
          <select class="form-select" id="schedule-target" name="target"></select></div>
        <div class="mb-3"><label class="form-label">Action</label>
          <select class="form-select" name="action" id="schedule-action"></select></div>
        <div class="mb-3"><label class="form-label">Heure</label>
          <input class="form-control" name="time" type="time" required></div>
        <div class="mb-3"><label class="form-label">Jours</label>
          <div class="btn-group w-100 flex-wrap" id="schedule-days">
            <input type="checkbox" class="btn-check" id="d1" value="1"><label class="btn btn-outline-primary" for="d1">Lu</label>
            <input type="checkbox" class="btn-check" id="d2" value="2"><label class="btn btn-outline-primary" for="d2">Ma</label>
            <input type="checkbox" class="btn-check" id="d3" value="3"><label class="btn btn-outline-primary" for="d3">Me</label>
            <input type="checkbox" class="btn-check" id="d4" value="4"><label class="btn btn-outline-primary" for="d4">Je</label>
            <input type="checkbox" class="btn-check" id="d5" value="5"><label class="btn btn-outline-primary" for="d5">Ve</label>
            <input type="checkbox" class="btn-check" id="d6" value="6"><label class="btn btn-outline-primary" for="d6">Sa</label>
            <input type="checkbox" class="btn-check" id="d7" value="7"><label class="btn btn-outline-primary" for="d7">Di</label>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="submit" class="btn btn-primary">Créer</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}<script src="/static/js/schedules.js"></script>{% endblock %}
