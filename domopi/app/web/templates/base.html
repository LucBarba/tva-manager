<!doctype html>
<html lang="fr" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DomoPi{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg border-bottom sticky-top bg-body">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="/"><i class="bi bi-house-heart-fill text-primary"></i> DomoPi</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link {% if page == 'dashboard' %}active{% endif %}" href="/"><i class="bi bi-grid-1x2"></i> Tableau de bord</a></li>
        <li class="nav-item"><a class="nav-link {% if page == 'shutters' %}active{% endif %}" href="/shutters"><i class="bi bi-window"></i> Volets</a></li>
        <li class="nav-item"><a class="nav-link {% if page == 'lights' %}active{% endif %}" href="/lights"><i class="bi bi-lightbulb"></i> Lumières</a></li>
        <li class="nav-item"><a class="nav-link {% if page == 'schedules' %}active{% endif %}" href="/schedules"><i class="bi bi-clock-history"></i> Programmations</a></li>
        <li class="nav-item"><a class="nav-link {% if page == 'history' %}active{% endif %}" href="/history"><i class="bi bi-journal-text"></i> Journal</a></li>
        <li class="nav-item"><a class="nav-link {% if page == 'settings' %}active{% endif %}" href="/settings"><i class="bi bi-gear"></i> Configuration</a></li>
      </ul>
      <div class="d-flex align-items-center gap-2">
        <button id="theme-toggle" class="btn btn-outline-secondary btn-sm" title="Basculer le thème">
          <i class="bi bi-moon-stars"></i>
        </button>
        <span class="navbar-text small"><i class="bi bi-person-circle"></i> {{ username }}</span>
        <button id="logout-btn" class="btn btn-outline-danger btn-sm" title="Déconnexion">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </div>
    </div>
  </div>
</nav>

<main class="container-fluid py-4 px-3 px-md-4">
  {% block content %}{% endblock %}
</main>

<div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
