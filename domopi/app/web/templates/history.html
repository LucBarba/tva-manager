{% extends "base.html" %}
{% block title %}Journal – DomoPi{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h1 class="h3 mb-0"><i class="bi bi-journal-text"></i> Journal d'événements</h1>
  <div class="d-flex gap-2">
    <select class="form-select form-select-sm" id="filter-source">
      <option value="">Toutes les sources</option>
      <option value="shutter">Volets</option>
      <option value="hue">Hue</option>
      <option value="matter">Matter</option>
      <option value="system">Système</option>
    </select>
    <button id="history-refresh" class="btn btn-outline-primary btn-sm"><i class="bi bi-arrow-clockwise"></i></button>
  </div>
</div>

<div class="table-responsive">
  <table class="table table-sm align-middle">
    <thead><tr><th>Date</th><th>Source</th><th>Type</th><th>Message</th></tr></thead>
    <tbody id="event-rows"></tbody>
  </table>
</div>
{% endblock %}
{% block scripts %}<script src="/static/js/history.js"></script>{% endblock %}
