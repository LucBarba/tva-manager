<!doctype html>
<html lang="fr" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion – DomoPi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/css/style.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center vh-100">
  <div class="card shadow-lg login-card">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <i class="bi bi-house-heart-fill text-primary display-4"></i>
        <h1 class="h4 mt-2">DomoPi</h1>
        <p class="text-body-secondary small">Connexion à votre maison</p>
      </div>
      <div id="login-error" class="alert alert-danger d-none" role="alert"></div>
      <form id="login-form">
        <div class="mb-3">
          <label class="form-label" for="username">Utilisateur</label>
          <input class="form-control" id="username" name="username" autocomplete="username" required maxlength="64">
        </div>
        <div class="mb-4">
          <label class="form-label" for="password">Mot de passe</label>
          <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required maxlength="128">
        </div>
        <button class="btn btn-primary w-100" type="submit"><i class="bi bi-box-arrow-in-right"></i> Se connecter</button>
      </form>
    </div>
  </div>
  <script src="/static/js/login.js"></script>
</body>
</html>
